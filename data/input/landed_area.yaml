launch:
  # Liftoff configuration
  yaw:
    - 283.0  # ランチャ包囲角 包囲角- 磁気偏角
  pitch: 
    - 80.0
  roll: 0.0
  latitude: 40.242865 # 緯度
  longitude: 140.010450 # 経度
  elevation: 5.3 # ランチャ標高
  launcher_length: 5.0 # ランチャ長さ
  wind_ref_altitude: 2.0
  ground_wind_dir:
    - 13.0
  ground_wind_speed:
    - 0.0
  wind_power_factor: 0.1666
  winds_table: data/input/tables/wind_table.csv
  range_kmz: data/input/21stNSE保安域案_海射場.kmz


rocket:
  # Rocket configuration
  projected_frontal_area: 0.0163 # 代表面積: 設計担当に聞いて
  wing_span: 0.14
  wing_chord: 0.09 # 機体翼弦長: 設計担当に聞いて

  # Inertia parameters
  inertia_xx: 0.042  # 慣性モーメント
  inertia_yy: 3.403
  inertia_zz: 3.403
  inertia_xy: 0.0
  inertia_xz: 0.0
  inertia_yz: 0.0

  # Mass parameters
  dry_weight: 17.059 # 機体乾燥重量: 設計担当に聞いて
  cg_x: 1.17 # 重心位置: 設計担当に聞いて ノーズから
  cg_y: 0.0
  cg_z: 0.0

  cp_x: 1.6285 # 空力中心: 設計担当に聞いて ノーズから
  cp_mach_table: "data/input/tables/cp_mach.csv"
  cp_y: 0.0
  cp_z: 0.0

  diameter: 0.144 # 直径

  # Tank parameters
  tank_x: 0.866238 # 酸化剤タンク重心位置: 設計担当に聞いて ノーズから
  tank_y: 0.0
  tank_z: 0.0
  tank_drain_x: 1.1
  tank_drain_y: 0.0
  tank_drain_z: 0.0
  tank_radius: 0.07 # 酸化剤タンク半径: 設計担当に聞いて
  tank_capacity: 3.528 # 酸化剤タンク容量: 設計担当に聞いて
  tank_density: 1.226 # 酸化剤タンク密度: 設計担当に聞いて

  # Fuel parameters
  fuel_x: 0.953278 # 燃料重心位置: 設計担当に聞いて ノーズから
  fuel_y: 0.0
  fuel_z: 0.0
  fuel_drain_x: 1.78 # 燃料排水口位置: 設計担当に聞いて ノーズから
  fuel_drain_y: 0.0
  fuel_drain_z: 0.0
  fuel_radius: 0.04 # 燃料半径: 設計担当に聞いて
  fuel_capacity: 0.522
  fuel_density: 1.0
  fuel_length: 0.34
  fuel_after_burn: 0.031

  # Parachute parameters
  parachute_full_deploy_time: 0.01
  parachute_area: # パラシュート面積: 設計担当に聞いて
  terminal_velocity: # 終端速度: 指定すると自動的にパラシュート面積が出る
    - 0.0
    - 25.0

  parachute_drag_coefficient: 1.2

  # Thrust parameters
  thruster_x: 1.878 # エンジン重心位置: 実質機体長さ
  thruster_y: 0.0
  thruster_z: 0.0

  # Aerodynamic coefficients
  lift_coefficient_alpha: 8.387848333 # よう力傾斜
  side_coefficient_beta: 0.0 # 0
  roll_damping_coefficient: -0.0423 # ロール減衰係数
  pitch_damping_coefficient: -2.306 # ピッチ減衰係数
  pitch_coefficient_alpha: 0.0 # ピッチ傾斜

  # Table paths
  fuel_remaining_table: 
  thrust_table: "data/input/tables/thrust.csv"
  cd0_table: "data/input/tables/cd0.csv"
  cdmach_table: "data/input/tables/cdmach.csv"
  cnmach_table: "data/input/tables/cnmach.csv"
  csmach_table: "data/input/tables/csmach.csv"

  
simulation:
  # Simulation configuration
  flight_duration: 4000.0
  time_step: 0.001
  parachute_deploy_delay: 0.01
  notify_interval: 5.0
  output_rate: 10

misc:
  kml_group_by:
    - ground_wind_speed
  result_each:
    - terminal_velocity
  landing_range_script: noshiro_sea