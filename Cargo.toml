[package]
name = "trajecsim_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
handlebars = "6.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
csv = "1.3"
askama = "0.12"
uom = { version = "0.36", features = ["serde", "f64"] }

[profile.release]
opt-level = 3
lto = true
